map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream battleship_app {
    server 127.0.0.1:5227;
    keepalive 16;
}

server {
    listen 80;
    server_name battleship.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name battleship.example.com;

    ssl_certificate /etc/letsencrypt/live/battleship.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/battleship.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /hub/ {
        proxy_pass http://battleship_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://battleship_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
