services:
  battleship:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["--urls", "http://0.0.0.0:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ForwardedHeaders__KnownProxies__0: "${BATTLESHIP_PROXY_IP:-172.30.52.1}"
      Storage__Directory: "/app/data"
    volumes:
      - accounts-data:/app/data
    ports:
      - "127.0.0.1:5227:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - app

volumes:
  accounts-data:

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: "${BATTLESHIP_SUBNET:-172.30.52.0/24}"
          gateway: "${BATTLESHIP_PROXY_IP:-172.30.52.1}"
